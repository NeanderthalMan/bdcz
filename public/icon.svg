<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Beadcause">
  <!--
    "bdcz" (bc-sv9qx) — the name of the public snapshot, set in one row. It was "bcz"
    until 2026-11-05. Nothing here is text: the letters are drawn as strokes so they
    render identically whatever fonts a phone has, and so the Android launcher vector
    (res/drawable/ic_launcher_foreground.xml) can be the same geometry rather than a
    second drawing.

    The letters keep the three-letter mark's drawing and its one rhythm: a 68 bowl, 30
    strokes, 48 between letters. d is b mirrored — bowl, then the stem on its right.
    Drawn at that size the ink is b 40..138, d 156..254, c 272..356, z 388..472 — 432
    across, centred on 256, and 189..323 down as before (the ascenders rise 36 above the
    240..308 bowl band).

    432 across does not fit at full size: the farthest ink, the ends of b's stem (55,204)
    and (55,308) and z's bottom-right corner (457,308), is 207.6 out from (256,256), and
    with the stroke's round cap 222.6 — past the 205 of the maskable safe zone (the centre
    80%) that icon-512.png's "any maskable" purpose asks for. So the row is scaled 0.85
    about the centre, which lands that ink at 189.2, 15.8 inside. The launcher's own
    guarantee is tighter and is met by a smaller scale on the vector rather than here;
    see ic_launcher_foreground.xml.
  -->
  <rect width="512" height="512" rx="112" fill="#0b0f14"/>
  <g transform="translate(256 256) scale(0.85) translate(-256 -256)"
     fill="none" stroke="#5eead4" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- b: stem, bowl -->
    <path d="M55 204 V308"/>
    <circle cx="89" cy="274" r="34"/>

    <!-- d: bowl, stem — b mirrored -->
    <circle cx="205" cy="274" r="34"/>
    <path d="M239 204 V308"/>

    <!-- cz. The c is a bowl with 110° taken out of its right side, so it shares its
         radius with b and d and the mark keeps one rhythm. -->
    <path d="M340.5 246.15 A34 34 0 1 0 340.5 301.85"/>
    <path d="M403 240 H457 L403 308 H457"/>
  </g>
</svg>
